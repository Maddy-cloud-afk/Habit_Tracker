<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Habit Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .main-box {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;

            display: flex;
            gap: 40px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        /* YOUR IMAGE ONLY */
        .image-box {
            width: 55%;
            height: 500px;
            border-radius: 15px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* DAILY HABITS */
        .habit-box {
            width: 45%;
            padding: 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .habit-box h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            margin-bottom: 20px;
        }

        .habit {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px;
            margin-bottom: 10px;

            background: #f5f5f5;
            border-radius: 10px;
        }

        .habit-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .habit input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-section {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .add-section input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .add-section button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .progress {
            margin-top: 15px;
        }

        .progress-bar {
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 7px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #4caf50;
            transition: 0.3s;
        }

        @media (max-width: 800px) {

            .main-box {
                flex-direction: column;
            }

            .image-box,
            .habit-box {
                width: 100%;
            }

            .image-box {
                height: 350px;
            }
        }
    </style>
</head>

<body>

    <h1>My Habit Tracker</h1>

    <div class="main-box">

        <!-- YOUR IMAGE -->
        <div class="image-box">
            <img src="Habit_Tracker.jpg-removebg-preview.png" alt="My Image">
        </div>

        <!-- RIGHT SIDE -->
        <div class="habit-box">

            <h2>My Daily Habits</h2>

            <p class="description">
                Write and track what I do every day.
            </p>

            <div class="add-section">
                <input
                    type="text"
                    id="habitInput"
                    placeholder="What do you do today?"
                >

                <button onclick="addHabit()">
                    Add
                </button>
            </div>

            <div id="habitList">

                <div class="habit">
                    <div class="habit-left">
                        <input type="checkbox" onchange="updateProgress()">
                        <span>Study for 1 hour</span>
                    </div>

                    <button class="delete-btn" onclick="deleteHabit(this)">
                        Delete
                    </button>
                </div>

                <div class="habit">
                    <div class="habit-left">
                        <input type="checkbox" onchange="updateProgress()">
                        <span>Exercise</span>
                    </div>

                    <button class="delete-btn" onclick="deleteHabit(this)">
                        Delete
                    </button>
                </div>

            </div>

            <div class="progress">
                <b>Today's Progress: <span id="percent">0%</span></b>

                <div class="progress-bar">
                    <div class="progress-fill" id="progress"></div>
                </div>
            </div>

        </div>

    </div>


    <script>

        function addHabit() {

            let input = document.getElementById("habitInput");

            let text = input.value.trim();

            if (text === "") {
                return;
            }

            let habitList = document.getElementById("habitList");

            let habit = document.createElement("div");

            habit.className = "habit";

            habit.innerHTML = `
                <div class="habit-left">

                    <input
                        type="checkbox"
                        onchange="updateProgress()"
                    >

                    <span>${text}</span>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteHabit(this)">
                    Delete
                </button>
            `;

            habitList.appendChild(habit);

            input.value = "";

            updateProgress();
        }


        function deleteHabit(button) {

            button.parentElement.remove();

            updateProgress();
        }


        function updateProgress() {

            let all =
                document.querySelectorAll(
                    "#habitList input[type='checkbox']"
                );

            let completed =
                document.querySelectorAll(
                    "#habitList input[type='checkbox']:checked"
                );

            let percentage = all.length === 0
                ? 0
                : Math.round(
                    (completed.length / all.length) * 100
                );

            document.getElementById("percent").innerText =
                percentage + "%";

            document.getElementById("progress").style.width =
                percentage + "%";


            all.forEach(function(check) {

                let text = check.nextElementSibling;

                if (check.checked) {
                    text.classList.add("completed");
                } else {
                    text.classList.remove("completed");
                }

            });
        }

    </script>

</body>
</html>
